- key: accounts-and-oshis
  date: 2026-09-13
  title: "Your account page, and oshis for supporters"
  version: "v1.4"
  changes:
    - added: "An Account page. Open it from your picture in the top right."
    - added: "You can connect Google, Discord and Patreon to the same account and sign in with any of them. If you lose one, the others still get you in."
    - added: "Pick a display name. It sits beside the random user_ handle, and no two people can have the same one."
    - added: "Patreon supporters can pick their oshis, and the first one becomes their picture on the site. Junior Class gets one, Classic Class three, Senior Class five. Everyone else gets the grey silhouette."
    - added: "The Account page shows your supporter tier and what comes with it."
    - added: "You can delete your account yourself, from the Account page. It takes your plan with it and can't be undone."
    - changed: "Logout is now inside the account menu, under your picture."
    - changed: "The home page, navbar and footer have been tidied up. Flatter bar, fewer boxes."
    - changed: "Loading and saving now spin a derpy Oguri instead of a plain ring."
    - changed: "The short notes under the calculator, Timeline and Selectors pages are gone again."
    - changed: "The About page and the privacy policy say what we actually store now: an anonymous account reference, your display name if you set one, your oshis if you pick any, and nothing else."

- key: carat-guide
  date: 2026-09-12
  title: "How your carats are worked out, in one guide"
  version: "v1.3"
  changes:
    - added: "A guide to how the calculator works out your carats: every income source and its schedule, a day-by-day example, and how pulls get paid for. It is in the footer as Carat Guide."
    - added: "The footer now reaches the FAQ, the changelog and the feedback form from every page."
    - added: "A few lines under the calculator, the Timeline and the Selectors page on how to read each one."
    - added: "Banners we recommend are marked in gold on the Timeline and get a star in the planner's banner list. Hover or tap a card on the Timeline to see what it is for."
    - changed: "League of Heroes #1 pays out at Platinum 1 now, as the spreadsheet does. Estimates from April 2027 on come out a little lower."
    - changed: "Sharing a link to a page now previews that page."
    - fixed: "The browser tab names the page straight away."

- key: patreon-sign-in
  date: 2026-09-09
  title: "Sign in with Patreon"
  version: "v1.2.1"
  changes:
    - added: "Patreon joins Google and Discord on the sign-in page."
    - changed: "Choosing Patreon starts a fresh account. If you already have a plan saved under Google or Discord, sign in the way you always have. The login page says the same thing under the buttons."
    - changed: "Time-limited umas, and anything under three stars, no longer show up in the selector pickers. A ticket cannot take them."
    - fixed: "Selector tickets stop paying for a reserved copy on banners where nothing they could actually take is featured. Those banners were coming out cheaper than they are, and the ticket was being used up on them."

- key: faster-loading
  date: 2026-09-04
  title: "Faster loading, and the selector tickets redone"
  version: "v1.2"
  changes:
    - changed: "The calculator opens a lot faster. The page frame is up from the first moment and the data is already on its way while you are still reading the home page. Clicking through used to mean a few seconds of blank spinner."
    - changed: "Selector tickets are a checkbox column now, with the cards you picked in a strip beside them. Click a card to change it. Campaign rows lost about half their height, which you will feel most on a phone."
    - changed: "New icons for the banner types and for the income ranks."
    - added: "Staged rows have the bulk-adjust pad now, and the keyboard shortcuts that go with it."
    - fixed: "That pad no longer covers the two rows underneath it. It is a single row of buttons."
    - fixed: "Team Trials income is labelled per week. It was saying per month."

- key: pull-count-pad
  date: 2026-09-03
  title: "Setting pull counts in bulk"
  version: "v1.1.1"
  changes:
    - added: "Click into the pulls box on a planner row and a pad of buttons opens under it: 10 at a time, 200 at a time, straight to the next pity threshold, or Max for everything that banner's carats, tickets and free pulls can pay for. Step-up rows get the same pad, counted in steps and rounds."
    - added: "Shift and Ctrl with the arrow keys move by ten and two hundred."
    - changed: "Only support banners show up in the Uncap Crystals picker now. Uma banners were in the list too, and none of them have a support card to uncap."
    - fixed: "A very long banner name no longer drags the staging row off the side of the screen, taking the confirm and discard buttons with it."

- key: post-beta-polish
  date: 2026-09-02
  title: "Staging, themes, and a round of fixes"
  version: "v1.1"
  changes:
    - added: "Colorblind mode. It is a switch in the theme menu, and it repaints the red and green status colours wherever they turn up."
    - added: "About and Terms pages, linked from the footer."
    - added: "The training pass pays an SSR uncap shard every month and the projection was counting none of it. Paid tier only."
    - changed: "The staging area no longer looks like the calculator. Staged rows sit on an amber background, the button reads \"Add to calculator\", and a line underneath says nothing is counted until you press it."
    - changed: "Every cell in the Uncap Crystals panel now names its unit."
    - changed: "The uncap banner picker lists names, not end dates."
    - changed: "Campaign rows on the Selectors page lost a lot of empty space. Card art doubled in size."
    - fixed: "Clearing a Timeline search or filter keeps your place. It used to fling you back to the top."
    - fixed: "Light theme: text in the banner dropdown was near unreadable, and the step-up button looked out of place."
    - fixed: "The Misc Earnings toggle was quoting 60 carats a day. It reads the live number now."
    - fixed: "A mistyped address gets a proper page-not-found."

- key: open-beta
  date: 2026-09-01
  title: "Open beta"
  version: "v1.0"
  changes:
    - added: "No more access code. Anyone can use the calculator now."
    - added: "Step-up banners. Plan them like any other banner, pick the ten cards you are aiming at, and the step costs and odds are handled for you."
    - added: "New FAQ page, covering where the numbers come from."
    - added: "A feedback form, if something looks wrong and you want to tell me about it."
    - added: "You can filter the Timeline now, by banner type, training scenario, or campaign."
    - added: "Banners running at the same time share a single Timeline card."
    - added: "Jump straight from a banner in your plan to its spot on the Timeline. Campaigns link through to their packs on the Selectors page."
    - added: "There is a thank-you list on the home page for everyone supporting the site."
    - changed: "The planner finally works on a phone."
    - changed: "Carat forecasts line up with the community spreadsheet now. If your numbers look different from what you remember, that is why."
    - changed: "All four projection toggles start switched on for new plans."
    - changed: "The site lives at umacaratcalculator.com now. Update your bookmarks."
    - changed: "Timeline filters stay put while you scroll, and there is a back-to-top button."
    - fixed: "Champions Meeting rewards land a day before the event ends, matching when the game pays out."
    - fixed: "Predicted dates for unannounced banners were double-counting some schedule adjustments. They are still predictions off the Japanese schedule, so expect them to move."
    - fixed: "Selector tickets now count against the banners they can actually reach. The webstore bonus credits as free carats."
