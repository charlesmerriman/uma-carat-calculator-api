    - added: "All of Champions Meeting 21 is open: the guide, My team and the Gallery."
    - changed: "Without early access, the event list and the Team window only show what you can open."
    - changed: "Tickets and shards from Champions Meeting and League of Heroes now count on the day you get them, not on the last day."
    - fixed: "Fixed the planner lagging when you change a row."

- key: guide-comments
  date: 2026-10-22
