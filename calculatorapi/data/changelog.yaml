# Changelog content — the source of truth for the /changelog page.
#
# `python manage.py sync_changelog` writes these entries into the database, and
# the production service runs it on every deploy (see backend/.do/app.yaml's
# run_command). So a changelog update is a normal commit: edit this file, open a
# PR into develop, and it goes live with the next push to master.
#
# Rules:
#   - `key` is the stable identity of an entry. Never change one after it has
#     shipped — a renamed key does not rename the entry, it creates a second one
#     and orphans the first.
#   - The file OWNS every entry whose key it lists. Editing one of those in the
#     Django admin works until the next deploy, which puts it back to what is
#     written here. Edit the file instead.
#   - Entries created by hand in the admin have no key, and this file never
#     touches them.
#   - Removing an entry from this file does NOT delete it from the site; it just
#     stops being managed. Delete it in the admin if that is what you meant.
#
# Shape of an entry:
#
#   - key: some-slug           # required, unique, stable
#     date: 2026-09-01         # required, ISO. What the page shows and sorts by.
#     title: "Open beta"       # required, <= 255 chars
#     version: "v1.0"          # optional badge, <= 50 chars. Omit for none.
#     changes:                 # optional; each item is one {category: text} pair
#       - added: "..."         #   categories: added | fixed | changed
#       - fixed: "..."         #   text <= 500 chars
#       - changed: "..."       #   displayed in the order written here
#
# Write for a player, not a developer: say what is different for them, not which
# module changed. Newest entry first is conventional here but not required — the
# page sorts by date.

- key: rankings-placeholders
  date: 2026-10-28
  title: "Rankings for supporters, and placeholder cards"
  version: "v2.9"
  changes:
    - added: "New for Patreon supporters: the Rankings page! See which cards and umas the PvP guides lean on most, what teams players build, what actually wins in CM Runs, and how everyone else plays."
    - added: "Rankings has Guides, PvP and Players tabs. Filter the guides the way the guide sheet does, open any row for its numbers, and see what climbed or fell this week. PvP shows the most built trios and the best win rates, and Players shows typical budgets by class and which selectors people plan to buy. Pin a top ten to the side of any page while you plan, or tuck it into the corner. On a phone the filters fold into one button."
    - added: "The PvP page gets a Rankings tab too, for supporters: which umas this event's gallery teams pick most, what the guide does with each one, and the three most copied posts."
    - added: "Placeholder cards. When any good card will do, a deck can hold one like \"Your best SSR Speed card\". They have their own switch in the card picker."
    - added: "Guides still being written now carry an Under construction banner."
    - changed: "A PvP guide opens on the style you picked last time again, not the one it ranks first."
    - changed: "The Privacy Policy now covers the Rankings page. Your saved PvP teams count toward its totals even if you never post them, and it only ever shows totals and medians."
    - fixed: "JP-only support cards sort under their proper type."
    - fixed: "The pulls pad in the planner stays on its row while you scroll."

- key: cm-runs-collection
  date: 2026-10-27
  title: "CM Runs, and your Collection"
  version: "v2.8"
  changes:
    - added: "Introducing the CM Runs tab, just in time for CM 21! Log every ticket race by race and watch your win rates come together for each uma."
    - added: "Meet the Collection, home for your veterans, umas and support cards. Veterans are the big one for CM Runs: link one to each runner and your win rates show which build is carrying you. Find it in your profile menu or on the Account page."
    - added: "In CM Runs, start a ticket in one tap from your last lineup or a team, then log each race with a single tap, Finals included. Skip a ticket or stop one early, clear a finished day's leftovers, leave a note, and see your win rates by uma and by veteran. It all saves to your account."
    - added: "In the Collection, add veterans by hand or import them from umadump's export files, along with the umas and cards you own. Veterans go by their grade and score like in the game. Filter them by uma or aptitude, and tap one for her full card: stats, aptitudes, skills, sparks and training. Stars, potential and limit breaks show on the art, each tab opens with a summary, Missing shows what you're short on, and an uma's tile links to her veterans."
    - added: "In My team, link each member to one of your veterans and her aptitude letters follow. A CM Runs ticket loaded from that team keeps the links, and the pickers can show only what you own."
    - changed: "Pages load faster when you're signed in. The site sends about a tenth of the data it used to, which you'll feel on a slow connection."
    - changed: "The Privacy Policy now covers logged runs, veterans and imports."

- key: pvp-guide-redesign
  date: 2026-10-24
  title: "PvP guides, redesigned from the ground up"
  version: "v2.7"
  changes:
    - changed: "The PvP guide page has been rebuilt from top to bottom. Nearly every part of it is new or redrawn."
    - added: "A new section at the top of each guide holds the style ranking, the meta notes, the recommended stats, the scenario and the team comps."
    - added: "The style ranking is a ladder with each style's top umas. Tap a face to jump to that style."
    - changed: "Recommended stats show as big tiles. A guide with several stat rows gets the full table, notes and all."
    - added: "You can see which scenario a guide is built for."
    - changed: "Team comps are drawn as slots in each style's colour."
    - changed: "Running styles use Hakuraku's colours, and its colorblind palette in Colorblind mode."
    - changed: "Guides open on the style they rank first. The style tabs show each rank."
    - changed: "Uma tiles are all one size, grouped under their stars, with the outfit on its own line. They spread evenly across the row."
    - added: "Every uma shows her aptitude letters for the course. A C is amber; D or worse is red."
    - changed: "Skills sit in tier rows, T0 to T4, inside each skill type. Every skill gets a box the same size."
    - changed: "On a phone, General skills fold away until you open them, so you get to the umas a lot sooner."
    - added: "Decks come one at a time. Pick Beginner, Standard or Whale and the site remembers your budget for every guide."
    - added: "Each deck says which cards every deck shares and what it swaps in."
    - changed: "Decks are animated. Switch budgets and shared cards slide to their new spots while the rest fade out. All opens every deck at once."
    - changed: "Card notes are tags now: 1SP, 2SP, Stats, Hints, Initial Friendship."
    - added: "Cards linked to the scenario get a Link badge. It replaces the red ring."
    - changed: "Honorable Mentions is a darker row of smaller cards."
    - changed: "A borrowed card has a grey tab behind it, like the game's Friend tag."
    - changed: "The All tab is a quick look at every style in ranking order. Top faces, best skills and each deck on one line, with +N opening the style."
    - added: "Use this deck sends a guide's deck to My team. Pick a spot or start a new team, and the cards get dealt in one at a time."
    - added: "Anything it can't place is named in the message. Undo puts your team back."
    - added: "Copy link gives you a guide link that shows a preview in Discord, ranking and stats included."
    - changed: "Comment buttons say which thread they open."
    - fixed: "Long skill and card names wrap instead of getting cut off."
    - added: "Something skill-shaped is being built behind the scenes. I'm not saying where. Yet."

- key: pvp-free-guide
  date: 2026-10-22
  title: "A free PvP guide, and Champions Meeting 21 for everyone"
