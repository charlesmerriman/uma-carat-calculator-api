    - added: "Notes on banner rows. Click the notepad on a row and write up to 500 characters. Hover it later to read the note back."
    - changed: "A selector you buy on the Selectors page now only counts for the card you picked for it. It used to pay for a reserved copy on any banner old enough, which made some plans look more affordable than they were."
    - changed: "No card picked yet? That selector pays for nothing. Hover the red Reserved box and it says so."
    - changed: "Selector tickets you already own work the same as before."
    - changed: "Your purchases are still shared by every plan."
    - changed: "The video on the home page is Henry Handsome Derby's walkthrough of this site now. It used to show whatever he uploaded last."

