  version: "v2.5"
  changes:
    - added: "Comment on each part of a PvP guide, and give a thumbs-up to the comments you agree with."
    - added: "You can type in your own monthly misc earnings in Projection Settings. Leave it alone and it keeps following our estimate."
    - added: "Every card on the Timeline has a Copy link button."
    - added: "PvP guides have an All tab with every running style on one page."
    - added: "Hover over or tap an alternative card to see its art."
    - changed: "Champions Meeting and League of Heroes rewards now count on the days they're paid. A banner that ends partway through an event gets what has come in so far."
    - changed: "The planner's numbers roll to their new value when you change something."
    - changed: "Gold skills look like they do in the game. Skills a guide pairs with a Scenario Link get a red ring."
    - changed: "The view tabs and running style tabs stay at the top of the PvP page while you scroll."
    - changed: "Guides can box their standout decks in gold."
    - changed: "Clearer tooltips on the pull and step counts."
    - changed: "The Privacy Policy and Terms now cover guide comments and thumbs-ups."
    - changed: "Comment threads in the gallery and on guides load when you open them, so the PvP page opens quicker."
    - changed: "Some code cleanup behind the scenes."

- key: oguri-bot
  date: 2026-10-21
  title: "Meet Oguri Bot, and bigger CM and LoH rewards"
  version: "v2.4"
  changes:
    - added: "Meet Oguri Bot, the calculator's new helper on our Discord."
    - added: "It posts every patch note in #calc-site-changelog, this one included."
    - added: "Post a bug or an idea in #carat-calculator-feedback. Once the team picks it up, Oguri Bot replies on your post, and again when it's planned and when it's done."
    - added: "It talks a little like Oguri Cap. Only a little."
    - changed: "Champions Meeting and League of Heroes rewards now follow the event number. The game raises them at set points (Champions Meeting 30, League of Heroes 6), and the events in your plan pay what they really will."
    - changed: "When upcoming events pay different amounts, the reward next to your rank shows the range."
    - fixed: "On a step-up, copies from selectors or SSR crystals now count toward the odds."
    - fixed: "Hovering the carat forecast shows the right date."
    - fixed: "The forecast no longer dips and jumps back up when one banner runs inside another. The longer banner's pulls come off when the shorter one ends, and its dot sits above the line."
    - fixed: "The logo stays visible on hover in the light themes."

- key: phone-planner-cards
  date: 2026-10-20
  title: "Shorter planner cards on a phone"
  version: "v2.3"
  changes:
    - changed: "On a phone, the odds under each planner card start folded. Tap Show odds on any card to bring them back on all of them, and your phone remembers."
    - changed: "Planner cards on narrow phones show both featured cards' pictures again."
    - changed: "The logo is back on two lines on a phone."

- key: carat-forecast
  date: 2026-10-19
  title: "A carat forecast, and a fresh coat of paint"
  version: "v2.2"
  changes:
    - added: "The calculator has a chart now. It follows your carats from today to past your last banner and shows the drop at each one."
    - added: "Switch it to Pulls to see uma and support pulls day by day, with a line at 200 for the exchange."
    - added: "Click a banner on the chart to jump to its row."
    - added: "Skipped Champions Meetings and League of Heroes show up as red dots."
    - added: "Tick Paid carats under the chart to stack them on top of your free ones. Step-ups finally show there too."
    - added: "Two new switches in the settings menu, for anyone who takes the 50-carat daily pull on every uma or support banner, including ones outside their plan. Both start off."
    - added: "With nothing planned yet, the calculator tells you how to get started, with a link to the Timeline."
    - added: "PvP guides have a section under the Overview for the skills every position should take."
    - changed: "The whole site got a design pass. New heading font, a proper header on the home page, and lighter cards on the dark themes."
    - changed: "Long pages fold up on a phone. The changelog, Legend Races, Selectors and the planner's scenario bands open when you tap them."
    - changed: "Timeline cards are titled by who's featured."
    - changed: "Each theme looks more like itself. Gilded no longer passes for Dark, Pearl has an accent colour, and Light's buttons are easier to read."
    - changed: "A banner you add to the plan flashes once, so you can see where it landed. Your device's reduced motion setting turns the animations off."
    - changed: "Paste a shared plan in Discord and it gets its own picture: total pulls and the banner names over the first banner's art."
    - changed: "Gallery posts pasted in Discord show the site's name and the event."
    - changed: "The shared plan page shows when each banner ends."
    - changed: "The PvP page works on a phone now. The event schedule runs down the screen, the tabs fit on one line, and teams in My team and the gallery show their cards in two rows of three."
    - changed: "On a phone, the team window is only as tall as your team."
    - changed: "The cookie prompt is a slim bar along the bottom of the screen."
    - changed: "The Privacy Policy now covers the Patreon supporter list."
    - fixed: "Scrolling no longer lags on themes other than Dark."
    - fixed: "Themes with a background glow show it on the calculator, Timeline and PvP pages again."
    - fixed: "The quick +10 and +100 buttons on a row stay clear of the numbers you're adjusting."
    - fixed: "When you're signed in, the home page button opens your plan."
    - fixed: "Group cards count as each of their umas in a deck, like in the game."
    - fixed: "A card that teaches a skill's ○ covers the ◎ in the team builder."
    - fixed: "Poster names in the gallery stay readable next to their badges."
    - fixed: "Recommendations stays reachable after switching views on the PvP page, and skill names fit their line."

- key: row-options
  date: 2026-10-16
  title: "Row options and skipping events"
  version: "v2.1"
  changes:
    - added: "Planner rows have their own options now, behind the note button."
    - added: "Give a banner a ticket limit. That number wins over the spend-tickets switch, and whatever it leaves goes to later rows."
    - added: "Paid carats can be set per banner: none, the daily discount only, or discount and full price."
    - added: "Already pulled on a banner that's running? Put those pulls in and they count toward its 200-pull exchange."
    - added: "Turn off Count this banner to keep a row in the plan without spending on it."
    - added: "Not playing a Champions Meeting or League of Heroes? Switch off Taking part on its Timeline card and its rewards come out of your income."
    - added: "The calculator says how many upcoming events you're skipping."
    - added: "Share a plan's link in Discord and it previews the plan: total pulls, the banners, and your notes if you chose to share them."
    - added: "The card picker on My team can filter by rarity: SSR, SR or R."
    - changed: "The shared plan page shows the total pulls too."
    - changed: "The PvP page keeps your place, running style included. Copy link points at that style."
    - changed: "Pick the gallery's uma filter from a grid of portraits."
    - fixed: "Decks follow the game's rules: no two cards of the same uma, and no card of the uma you're building for. Group cards are exempt."
    - fixed: "Every outfit of a favourite uma gets the rainbow frame."
    - fixed: "Patreon sign-in and linking work on iPhone."
    - fixed: "If the calculator is slow to load, you get a Try again button after 20 seconds."

- key: pvp-early-access
  date: 2026-10-14
  title: "PvP guides, teams and a gallery"
  version: "v2.0"
  changes:
    - added: "There's a PvP tab now. Patreon supporters get it first, and it opens to everyone soon."
    - added: "Pick a Champions Meeting or League of Heroes event to see its course, scenario and key dates."
    - added: "An event's guide covers the stats to aim for, the best umas for each running style, the skills worth having and some example decks. Skills come with their in-game descriptions."
    - added: "Cards released since the last event get their own list."
    - added: "Build your team on My team: three umas, a running style each, six support cards apiece."
    - added: "Search cards by name or by a skill they teach. Anything the guide recommends is marked."
    - added: "Teams save to your account, or on this device if you aren't signed in."
    - added: "The Team button in the menu bar opens your team over any planner page. Stick notes on it while you plan your pulls."
    - added: "The gallery: post your team and browse everyone else's, sorted by Hot, Top or New."
    - added: "Upvote, comment, or copy a team into your own."
    - added: "Every post has its own link. Paste it in Discord or on X and it shows the three umas."
    - added: "Supporters' upvotes count for more, and their posts stand out."
    - added: "Posts and comments have a Report button."
    - added: "Your account page lists your gallery posts. A switch there hides your Patreon tier on them."
    - changed: "Every uma on the site sits in the same silver frame now. Your own favourites get a rainbow one."
    - changed: "The Privacy Policy and Terms now cover the gallery: what everyone can see when you post or comment, and what you can't post."

- key: 2026-10-fixes
  date: 2026-10-13
  title: "A few fixes"
  version: "v1.15"
  changes:
    - fixed: "The menu bar stays at the top of the screen again as you scroll. This was broken on phones, and on the home, FAQ and other info pages on desktop."
    - fixed: "On a shared plan, the copy button now sits above the banner list."
    - fixed: "Hovering a support banner's pictures in the planner names that banner now, not the uma banner running at the same time. Its note box does too."
    - changed: "The carat income guide is gone. The FAQ still explains where each income source comes from."

- key: share-links
  date: 2026-10-12
  title: "Share a plan with a link"
  version: "v1.14"
  changes:
    - added: "You can now share a plan. Open the plan menu, pick Share this plan and turn the link on."
    - added: "Anyone with the link can copy your plan, into their account or onto their device. Their copy is theirs to change, and yours stays as it is."
    - added: "Your resources and notes go along only if you tick them. Resources means your carats, tickets, ranks and planned purchases."
    - added: "See how many times your plan has been copied."
    - added: "Reset the link whenever you like. The old one stops working."
    - changed: "Monthly Shop Tickets now sit in Purchases, under the passes."
    - added: "The \"back to top\" button is on the Changelog and FAQ pages too."

- key: visit-sources
  date: 2026-10-09
  title: "Where visits come from"
  version: "v1.13"
  changes:
    - changed: "Our own visit counter now also notes which page you arrived on and which site linked you here. Only the site's name is kept, never the rest of the link, and the Privacy Policy says so."

- key: favourites-for-everyone
  date: 2026-10-07
  title: "A favourite uma musume for everyone, and a target for two-card odds"
  version: "v1.12"
  changes:
    - added: "Every account can pick a favourite uma musume now, and she becomes your picture. It used to take a Patreon pledge."
    - changed: "Supporters get more slots: 3 on Junior Class, 5 on Classic, 7 on Senior. If a pledge lapses, the picture stays."
    - changed: "Costume variants, the (Summer) style rows, are a supporter perk in the picker. Free accounts see them locked. Anyone who already picked one keeps her."
    - changed: "The (All) row is out of the picker."
    - changed: "Your picture and the picker tiles are square now."
    - changed: "The Legend Races tab lists your favourites at the top for every signed-in account, not just supporters."
    - added: "On a banner with two rate-ups and Also show ticked, you can choose how far the first card goes before a spare copy counts toward the second: anything from one copy to 5x, or MLB on a support banner. The choice is saved with the plan."
    - changed: "The copies you get at every 200 pulls and your reserved copies are one pot now. They fill the first card to your target, and whatever is left goes to the second card instead of being wasted."
    - changed: "On a double uma rate-up, the first uma is taken to one copy by default. Extra copies of an uma add a little talent, nothing like a support's limit breaks."
    - changed: "Each box in the two-card strip names both cards' levels, like 1x & 2x or MLB & 1LB, and the line above it says which card is which."

- key: rate-up-odds
  date: 2026-10-06
  title: "Real rate-up odds"
  version: "v1.11"
  changes:
    - fixed: "Step-up odds now count the guaranteed card at the end of steps 3 and 4. Over fifteen steps, that takes your chance to MLB from 7.5% to about 27%."
    - fixed: "Every rate-up card uses its real rate. ★2 cards are 2.25%, and on a banner with lots of rate-ups, each one gets a smaller share."
    - added: "Banners with more than one rate-up let you choose the card you're chasing. Click Odds for to switch, or tick Also show to see your odds on a second card at the same time. Your choice stays with the plan."
    - added: "If the site updates while you have it open, you'll get a message with a Refresh button."
    - fixed: "MLB chance bars are drawn to scale."
    - fixed: "On light themes, banner type boxes, step-up chips and the uncap crystal estimate use the theme's colours. Pull counts at pity or over budget stand out more."
    - changed: "Staged banners line up with the calculator rows below. Add to calculator sits in the MLB column, and discarding one uses the trashcan."
    - fixed: "The uncap crystal estimate remembers your banner when you switch pages."
    - changed: "Predicted dates on the Timeline follow the daily reset, like confirmed ones. Some move by a day."
    - fixed: "A Champions Meeting ending the day after a banner closes no longer adds its carats to that banner."

- key: daily-legend-races
  date: 2026-10-05
  title: "Daily legend races"
  version: "v1.10"
  changes:
    - added: "Legend Races, a new tab. It shows when each batch of umas joins the daily legend races, and who is in it."
    - added: "Search it by name to find one uma."
    - added: "The furthest batches have no date yet. They are listed as tentative."
    - added: "On the Timeline, a banner's card tells you when a batch arrives with it. Click the note to see the umas."
    - added: "Supporters get a line for each of their oshis at the top of the tab: when she joins, or that she is already in."
    - changed: "On a phone, the tabs show the icon above the name. Four of them did not fit side by side."
    - fixed: "When a link takes you to a card on the Timeline, the card is outlined so you can find it."

- key: guest-plans-and-spare-tickets
  date: 2026-10-01
  title: "Plans without an account, spare tickets, and more themes"
  version: "v1.9"
  changes:
    - added: "Your plan is saved on this device now, even without an account. Reload the page or come back tomorrow and it is still there."
    - added: "Sign in later and the plan on your device is added to your account."
    - added: "Clear plan and start over, in the settings menu, for guests who want an empty planner."
    - added: "Spend Tickets on Banners, a new switch in settings. Turn it off to keep your tickets as spares. The planner then pays for pulls with carats only and your ticket balance carries forward."
    - added: "You can set how many shop tickets you buy each month, uma and support separately. It used to assume 4 of each."
    - added: "Five more light themes: Blue, Green, Red, Purple and Pearl."
    - changed: "A plan with separate resources keeps its own purchases too. The Selectors page tells you when the purchases on screen belong to that plan only."
    - changed: "The quick buttons on a pull count fit the row now. Uma rows step by half a pity, support rows by a full one, and a step-up row gets Limit, which fills in every step the banner sells."
    - changed: "Copies and discounted pack counts have quick buttons as well."
    - changed: "When an uma banner and its support banner start on different days, the Timeline shows them as one card and says which side starts later."
    - fixed: "A banner row shows 0 tickets when you are short, never a negative number."

- key: cookie-prompt
  date: 2026-09-22
  title: "A cookie prompt, a clearer privacy policy, and feedback on Discord"
  version: "v1.8"
  changes:
    - added: "The site asks about cookies now. Accept or Reject on your first visit. The only things that set one are Google Analytics and, later on, ads; signing in and your settings never do. Cookie settings in the footer lets you change your answer."
    - changed: "The privacy policy has been rewritten. It now spells out who runs the site, what is stored and why, how long it is kept, and what you can ask us to do with it."
    - changed: "Feedback goes through Discord now. The Feedback page links you there."

- key: picked-selectors
  date: 2026-09-21
  title: "Selectors go to the card you picked, plans with their own resources, and notes"
  version: "v1.7"
  changes:
    - added: "A plan can keep its own resources now. Open the plan's menu and turn on \"Use separate resources for this plan\". Its carats, tickets and ranks stop following your main ones. Handy if you play a second account."
