alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
databases:
- engine: PG
  name: dev-db-462490
  version: "17"
# App-level env vars (shared by all components) — DigitalOcean Spaces image storage
envs:
- key: DO_SPACES_ACCESS_KEY
  scope: RUN_TIME
  # This must be the Spaces *access key ID* (the short "DO00..." string), NOT the
  # friendly name the key was given in the DO dashboard. Both are shown side by side
  # in `doctl spaces keys list`, which makes them easy to mix up. Getting it wrong
  # fails silently in a very misleading way: image *reads* keep working (they go
  # through the public CDN domain and need no credentials), so the site looks fine
  # while every authenticated operation — admin uploads and the "Choose from library"
  # picker — dies with InvalidAccessKeyId. The access key ID is not a secret; only
  # DO_SPACES_SECRET_KEY below is.
  value: DO002P78GKB6MN6749TL
- key: DO_SPACES_SECRET_KEY
  scope: RUN_TIME
  type: SECRET
  value: ""  # Set this in the DigitalOcean dashboard — never commit the real value
- key: DO_SPACES_BUCKET_NAME
  scope: RUN_TIME
  value: umacalculatorimages
- key: DO_SPACES_ENDPOINT_URL
  scope: RUN_TIME
  value: https://nyc3.digitaloceanspaces.com
- key: DO_SPACES_CDN_DOMAIN
  scope: RUN_TIME
  value: umacalculatorimages.nyc3.cdn.digitaloceanspaces.com
features:
- buildpack-stack=ubuntu-22
# ── Running a one-off data repair against production ────────────────────────
#
# NOT PART OF THE LIVE SPEC. Production has no `jobs:` block — this is a recipe,
# kept here because it is the only way to reach the production database without
# a shell: the app's database is an App Platform *dev* database, with no
# external endpoint and no trusted-sources list to add an IP to. It was applied
# once on 2026-08-17 to run `fix_support_card_variants --dry-run`, then removed.
#
# POST_DEPLOY runs once per deployment, after the service is healthy. Any
# command run this way MUST be idempotent and MUST exit 0 when it has nothing to
# do — a failing POST_DEPLOY job fails the deployment.
#
# DO NOT `doctl apps update --spec .do/app.yaml`. The SECRET values in this file
# are committed as "" and would overwrite the real ones. Take the live spec
# first, which carries them as encrypted EV[1:...] blobs, and add the block to
# that copy:
#
#     doctl apps spec get <app-id> > /tmp/live-spec.yaml
#     # append the block below, then:
#     doctl apps update <app-id> --spec /tmp/live-spec.yaml
#     doctl apps logs <app-id> fix-support-card-variants --type run
#     # ...and update again from a fresh spec with the block dropped.
#
# Only DATABASE_URL is needed: the app-level envs above already reach every
# component, and SECRET_KEY / ALLOWED_HOSTS have defaults a database-only
# management command never exercises.
#
# jobs:
# - name: fix-support-card-variants
#   kind: POST_DEPLOY
#   environment_slug: python
#   source_dir: /
#   github:
#     branch: master
#     deploy_on_push: true
#     repo: charlesmerriman/uma-carat-calculator-api
#   build_command: pip install -r requirements.txt
#   run_command: python manage.py fix_support_card_variants --dry-run
#   instance_count: 1
#   instance_size_slug: apps-s-1vcpu-0.5gb
#   envs:
#   - key: DATABASE_URL
#     scope: RUN_TIME
#     value: ${dev-db-462490.DATABASE_URL}
# Custom domains, added 2026-08-31. The apex is PRIMARY; www is an ALIAS. Both
# name the DigitalOcean-managed DNS zone, so App Platform writes the records and
# renews the certificate itself. The .ondigitalocean.app hostname keeps working
# permanently alongside these and stays the health-check target.
domains:
- domain: umacaratcalculator.com
  type: PRIMARY
  zone: umacaratcalculator.com
- domain: www.umacaratcalculator.com
  type: ALIAS
  zone: umacaratcalculator.com
ingress:
  rules:
  - component:
      name: calculatorproject
    match:
      path:
        prefix: /api
  - component:
      name: calculatorcapstoneclient
    match:
      path:
        prefix: /
  - component:
      name: calculatorproject
      preserve_path_prefix: true
    match:
      path:
        prefix: /admin
  - component:
      name: calculatorproject
      preserve_path_prefix: true
    match:
      path:
        prefix: /static
name: umamusme-calculator
region: nyc
services:
- build_command: pip install -r requirements.txt && python manage.py collectstatic --noinput
  environment_slug: python
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${dev-db-462490.DATABASE_URL}
  - key: DJANGO_SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: ""  # Set this in the DigitalOcean dashboard — never commit the real value
  - key: DJANGO_ALLOWED_HOSTS
    scope: RUN_AND_BUILD_TIME
    value: umacaratcalculator.com,www.umacaratcalculator.com,umamusme-calculator-7zdcg.ondigitalocean.app
  # Origin of the SPA. The backend derives OAUTH_REDIRECT_URI from this as
  # "<FRONTEND_URL>/auth/callback", which must match the redirect URI registered
  # in the Google and Discord consoles EXACTLY — including the scheme and the
  # absence of a trailing slash.
  - key: FRONTEND_URL
    scope: RUN_TIME
    value: https://umacaratcalculator.com
  # The path the ingress below serves this API under. App Platform strips it
  # before a request reaches Django, so the OpenAPI schema is told explicitly;
  # without it Swagger UI's "Try it out" would call the static site instead.
  - key: API_PUBLIC_PREFIX
    scope: RUN_TIME
    value: /api
  # OAUTH_EXTRA_REDIRECT_URIS is set in the DigitalOcean DASHBOARD, not here, and
  # is deliberately absent from this file. Current value:
  #
  #   http://localhost:5173/auth/callback
  #
  # That entry is what lets `npm run dev:live` — a local Vite server pointed at
  # THIS deployment — complete a real sign-in instead of bouncing the developer
  # to the deployed site. Consequence: a signed-in local frontend writes to the
  # live database. See backend/docs/auth-and-privacy.md.
  #
  # The old App Platform hostname is not listed, so sign-in there is refused
  # with a 400 even though the site still loads. OAUTH_ALLOWED_REDIRECT_URIS is
  # {derived OAUTH_REDIRECT_URI} + these, so moving FRONTEND_URL again silently
  # drops the previous host unless it is added here.
  #
  # Kept out of the committed spec because this repo is public and there is no
  # reason to advertise that production accepts a loopback callback, and because
  # revoking it should not require a commit.
  #
  # ⚠ `doctl apps update --spec .do/app.yaml` WOULD ERASE IT. Read the live spec
  # first (`doctl apps spec get <app-id>`) and re-apply the key, or set it again
  # in the dashboard afterwards.
  # Social sign-in credentials. Client IDs are public; the secrets must be set
  # in the DigitalOcean dashboard and never committed.
  - key: GOOGLE_OAUTH_CLIENT_ID
    scope: RUN_TIME
    value: ""
  - key: GOOGLE_OAUTH_CLIENT_SECRET
    scope: RUN_TIME
    type: SECRET
    value: ""
  - key: DISCORD_OAUTH_CLIENT_ID
    scope: RUN_TIME
    value: ""
  - key: DISCORD_OAUTH_CLIENT_SECRET
    scope: RUN_TIME
    type: SECRET
    value: ""
  github:
    branch: master
    deploy_on_push: true
    repo: charlesmerriman/uma-carat-calculator-api
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  name: calculatorproject
  # sync_changelog writes calculatorapi/data/changelog.yaml into the changelog
  # table. It sits here because a deploy is the only route to the production
  # database (see the POST_DEPLOY recipe above), and it is SAFE here because a
  # changelog file that does not validate reports the problem and exits 0 —
  # a typo in a patch note must not be able to stop the API booting. Pass
  # --strict locally, never here.
  #
  # ⚠ This line is part of the SERVER-SIDE spec: editing it in this file does
  # nothing on its own. Apply it with the `doctl apps spec get` /
  # `doctl apps update` dance described above, which preserves the secrets
  # this committed copy carries as "".
  run_command: python manage.py migrate && python manage.py sync_changelog && gunicorn calculatorproject.wsgi:application --bind 0.0.0.0:8080
  source_dir: /
static_sites:
- build_command: npm install && npm run build
  # Catch-all for any path with no document of its own. `spa.html` is the EMPTY app
  # shell the frontend build keeps next to its prerendered pages (scripts/prerender.mjs
  # in the web repo); `index.html` is the prerendered HOMEPAGE and must not be the
  # fallback, or every unknown path would hydrate the home page's markup.
  # ORDER MATTERS on the live app: change this only AFTER a frontend deploy that ships
  # spa.html is ACTIVE, or every deep link 404s until one does.
  catchall_document: spa.html
  environment_slug: node-js
  envs:
  - key: VITE_API_URL
    scope: BUILD_TIME
    value: https://umacaratcalculator.com/api
  github:
    branch: master
    deploy_on_push: true
    repo: charlesmerriman/uma-carat-calculator-web
  name: calculatorcapstoneclient
  output_dir: dist
  source_dir: /
