name: Patreon supporters sync

# App Platform has no scheduler of its own — its only job hooks are PRE_DEPLOY
# and POST_DEPLOY, which fire on deploys rather than on a clock. So the schedule
# lives here and the work happens in the API, behind POST /patreon/sync.
#
# This job never sees member data: it posts a key and gets counts back. Nothing
# it can do publishes a name — see calculatorapi/views/patreon_supporters.py.
#
# Required repository secret:
#   PATREON_SYNC_SECRET  must match the API's PATREON_SYNC_SECRET byte-for-byte
on:
  schedule:
    # 06:17 UTC daily. Off the hour deliberately — scheduled runs cluster at :00
    # across all of GitHub and get queued behind everyone else's.
    - cron: "17 6 * * *"
  # So the sync can be run by hand from the Actions tab without waiting a day,
  # and so a failure can be retried immediately after fixing the token.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the supporters sync
        env:
          # UPDATE ON A DOMAIN MOVE. Written here rather than kept in a secret on
          # purpose: it is not sensitive (the route 403s without the key), and a
          # secret cannot be searched. It used to be one, still pointing at the
          # ondigitalocean.app host when that host started 301ing to the custom
          # domain, and the sync failed daily for a week (2026-10-07 to 10-13)
          # before anyone looked. A search for the old domain finds it here.
          SYNC_URL: https://umacaratcalculator.com/api/patreon/sync
          SYNC_SECRET: ${{ secrets.PATREON_SYNC_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_SECRET:-}" ]; then
            echo "PATREON_SYNC_SECRET is not set on this repo."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # -sS: quiet, but still print errors. The last line carries the status
          # and, for a redirect, where it points, so a failure can report both.
          #
          # Redirects are deliberately NOT followed (no -L). curl replays a 301
          # or 302 as a GET, which this route answers with a 405, and it would
          # send X-Patreon-Sync-Key on to whatever host the Location header
          # names. Following silently would also hide the stale URL for good.
          response=$(curl -sS -X POST "$SYNC_URL" \
            -H "X-Patreon-Sync-Key: $SYNC_SECRET" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code} %{redirect_url}")

          meta=$(printf '%s' "$response" | tail -n 1)
          body=$(printf '%s' "$response" | sed '$d')
          status=${meta%% *}
          # Everything after the first space; empty when there was no redirect.
          location=${meta#* }

          echo "HTTP $status"
          echo "$body"

          # A redirect means the site moved and SYNC_URL above didn't. Say so
          # directly, rather than leaving a bare "HTTP 301" to be decoded.
          case "$status" in
            3??)
              echo "::error::$SYNC_URL redirects (HTTP $status) to ${location:-an unstated location}. The site has moved: update SYNC_URL in .github/workflows/patreon-sync.yml."
              exit 1
              ;;
          esac

          # Fail loudly. A silently stale supporters list is the failure mode
          # this whole job exists to prevent, so an expired token has to show up
          # as a red X rather than a green tick over a 502.
          if [ "$status" != "200" ]; then
            echo "::error::Patreon sync failed with HTTP $status"
            exit 1
          fi
